name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover testes

      - name: Coletar notícias da Câmara
        run: python coletor/coletar.py

      - name: Processar
        run: python coletor/processar.py

      - name: Salvar dados no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados site/dados.js
          git diff --cached --quiet || git commit -m "Atualiza dados $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicar
        uses: actions/deploy-pages@v4
